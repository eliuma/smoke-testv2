name: Container Smoke Test
description: Test a locally built application image using Testcontainers.

inputs:
  image:
    description: Application image already loaded into the runner Docker daemon.
    required: true

  container-port:
    description: HTTP port the application listens on inside the container.
    required: true

  health-path:
    description: Application health endpoint, including any context path.
    required: false
    default: /healthz

  expected-status:
    description: HTTP status required for a successful health check.
    required: false
    default: "200"

  timeout:
    description: Seconds to wait for HTTP readiness after container startup.
    required: false
    default: "60"

  interval:
    description: Seconds between health-check attempts.
    required: false
    default: "2"

  container-env:
    description: JSON object of environment variables for the test application.
    required: false
    default: "{}"

outputs:
  report-path:
    description: Directory containing JUnit results and container logs.
    value: ${{ steps.prepare.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Prepare isolated test environment
      id: prepare
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: |
        set -euo pipefail

        TEST_DIRECTORY=$(mktemp -d "${RUNNER_TEMP}/container-smoke.XXXXXX")
        mkdir -p "${TEST_DIRECTORY}/reports"

        echo "test-directory=${TEST_DIRECTORY}" >> "$GITHUB_OUTPUT"
        echo "report-path=${TEST_DIRECTORY}/reports" >> "$GITHUB_OUTPUT"

        python3 -m venv "${TEST_DIRECTORY}/venv"
        "${TEST_DIRECTORY}/venv/bin/python" -m pip install \
          -r "${ACTION_DIRECTORY}/requirements-test.txt"

    - name: Run container smoke test
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        TEST_DIRECTORY: ${{ steps.prepare.outputs.test-directory }}
        TEST_IMAGE: ${{ inputs.image }}
        CONTAINER_PORT: ${{ inputs.container-port }}
        HEALTH_PATH: ${{ inputs.health-path }}
        EXPECTED_STATUS: ${{ inputs.expected-status }}
        HEALTH_TIMEOUT: ${{ inputs.timeout }}
        HEALTH_INTERVAL: ${{ inputs.interval }}
        CONTAINER_ENV_JSON: ${{ inputs.container-env }}
        REPORT_DIRECTORY: ${{ steps.prepare.outputs.report-path }}
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        set -euo pipefail

        "${TEST_DIRECTORY}/venv/bin/python" -m pytest \
          "${ACTION_DIRECTORY}/test-container.py" \
          -v -s \
          -p no:cacheprovider \
          --junitxml="${REPORT_DIRECTORY}/junit.xml"